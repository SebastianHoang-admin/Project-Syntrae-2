<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Syntrae</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --ink:#0b1224; --glass:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.12); --accent:#22d3ee; --accent-hot:#f97316; --text:#e2e8f0; --muted:#94a3b8; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif; }
        body { min-height:100vh; background: radial-gradient(circle at 20% 20%, rgba(34,211,238,0.08), transparent 30%), radial-gradient(circle at 80% 10%, rgba(249,115,22,0.08), transparent 25%), linear-gradient(145deg,#0a0f1f 0%,#0f172a 60%,#0b1224 100%); color:var(--text); display:flex; flex-direction:column; padding:24px; }
        .brand { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:18px; }
        .brand-link { text-decoration:none; color:inherit; display:inline-flex; }
        .logo-icon { width:44px; height:44px; display:grid; place-items:center; border-radius:12px; background:linear-gradient(135deg,#f84f25,#b8120e); box-shadow:0 10px 24px rgba(248,79,37,0.35); padding:6px; }
        .logo-text { display:flex; flex-direction:column; gap:2px; align-items:flex-start; }
        .logo-text span:first-child { font-size:18px; font-weight:700; letter-spacing:1.5px; }
        .logo-text span:last-child { font-size:12px; color:var(--muted); }
        .main { flex:1; display:grid; place-items:center; padding:24px 0; }
        .card { width:min(520px,100%); background:rgba(8,10,16,0.6); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:32px; box-shadow:0 16px 36px rgba(0,0,0,0.35); backdrop-filter:blur(8px); }
        .card h1 { font-size:24px; margin-bottom:8px; letter-spacing:0.5px; }
        .card p { color:var(--muted); margin-bottom:20px; }
        .field { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
        .field label { font-weight:600; color:var(--text); }
        .field input { padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text); font-size:15px; outline:none; transition:all 0.2s ease; }
        .field input:focus { border-color:rgba(34,211,238,0.6); box-shadow:0 0 0 3px rgba(34,211,238,0.12); }
        .actions { display:flex; flex-direction:column; gap:12px; margin-top:8px; }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:14px; font-weight:700; font-size:14px; cursor:pointer; border:none; text-decoration:none; transition:all 0.2s ease; width:100%; }
        .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent-hot)); color:#0b1224; box-shadow:0 12px 26px rgba(34,211,238,0.3); }
        .btn-ghost { background:rgba(255,255,255,0.04); color:var(--text); border:1px solid rgba(255,255,255,0.08); }
        .btn:hover { transform:translateY(-1px); box-shadow:0 16px 30px rgba(34,211,238,0.18); }
        .link-row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; font-size:14px; }
        .link-row a { color:var(--accent); text-decoration:none; }
        .link-row a:hover { text-decoration:underline; }
        .footer { text-align:center; color:var(--muted); font-size:13px; padding:16px 0; }
        .status {
            margin: 8px 0 12px;
            padding: 10px 12px;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
        }
        .status[data-type="error"] { color: #fecdd3; border-color: rgba(248, 79, 37, 0.35); }
        .status[data-type="success"] { color: #bbf7d0; border-color: rgba(74, 222, 128, 0.35); }
        .status[data-type="info"] { color: var(--text); }
        .captcha-wrap { margin: 8px 0 4px; }
    </style>
    <link rel="stylesheet" href="css/syntrae-product-theme.css">
</head>
<body>
    <main class="main">
        <a class="brand brand-link" href="landing.html">
            <div class="logo-icon" aria-label="Syntrae logo"><i class="fas fa-chart-line" aria-hidden="true"></i></div>
            <div class="logo-text">
                <span>SYNTRAE</span>
                <span>Decision Studio</span>
            </div>
        </a>
        <div class="card">
            <h1>Reset your password</h1>
            <p>Enter the email associated with your account and we’ll send you reset instructions.</p>
            <div id="auth-message" class="status" hidden></div>
            <form id="forgot-password-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>
                </div>
                <div id="turnstile-widget" class="captcha-wrap" aria-label="CAPTCHA verification"></div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i>Send reset link</button>
                    <div class="link-row">
                        <a href="sign-in.html">Return to sign in</a>
                        <a href="sign-up.html">Create an account</a>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div class="footer">© 2026 Syntrae LLC. Predictive social science for considerate decisions.</div>
    <script src="js/supabase-config.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
