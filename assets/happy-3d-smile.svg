<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Happy 3D smile</title>
  <desc id="desc">A friendly yellow 3D-style smiling face with soft highlights.</desc>
  <defs>
    <radialGradient id="face" cx="34%" cy="24%" r="72%">
      <stop offset="0%" stop-color="#fff7a8"/>
      <stop offset="42%" stop-color="#ffd85f"/>
      <stop offset="78%" stop-color="#f6b93f"/>
      <stop offset="100%" stop-color="#e69325"/>
    </radialGradient>
    <radialGradient id="shine" cx="38%" cy="28%" r="46%">
      <stop offset="0%" stop-color="#fffce7" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#fffce7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fffce7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cheek" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8f76" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#f66f59" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#255d54" flood-opacity="0.22"/>
      <feDropShadow dx="-8" dy="-8" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.35"/>
    </filter>
    <filter id="innerSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <ellipse cx="256" cy="428" rx="142" ry="28" fill="#214d47" opacity="0.12"/>
  <circle cx="256" cy="244" r="176" fill="url(#face)" filter="url(#softShadow)"/>
  <circle cx="212" cy="188" r="112" fill="url(#shine)"/>
  <path d="M128 296c17 88 83 137 159 125 68-11 117-62 130-127-29 48-81 81-144 85-68 4-122-26-145-83z" fill="#ab681c" opacity="0.13" filter="url(#innerSoft)"/>

  <ellipse cx="177" cy="268" rx="34" ry="22" fill="url(#cheek)" opacity="0.58"/>
  <ellipse cx="338" cy="268" rx="34" ry="22" fill="url(#cheek)" opacity="0.58"/>

  <path d="M160 201c17-24 53-24 70 0" fill="none" stroke="#1e3d38" stroke-width="18" stroke-linecap="round"/>
  <path d="M282 201c17-24 53-24 70 0" fill="none" stroke="#1e3d38" stroke-width="18" stroke-linecap="round"/>

  <path d="M164 292c34 57 143 60 184 0" fill="none" stroke="#1e3d38" stroke-width="22" stroke-linecap="round"/>
  <path d="M186 316c42 33 112 32 148-3" fill="none" stroke="#fff7da" stroke-width="10" stroke-linecap="round" opacity="0.76"/>

  <path d="M344 110c18 8 37 28 45 50" fill="none" stroke="#fffbe0" stroke-width="16" stroke-linecap="round" opacity="0.72"/>
  <circle cx="196" cy="124" r="16" fill="#fffbe0" opacity="0.54"/>
  <circle cx="367" cy="178" r="10" fill="#fffbe0" opacity="0.56"/>
</svg>
