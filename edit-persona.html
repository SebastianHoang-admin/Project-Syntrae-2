<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Persona | Syntrae</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0b1224;
      --panel: rgba(255,255,255,0.04);
      --panel-strong: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.12);
      --accent: #22d3ee;
      --accent-hot: #f97316;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --glow: rgba(34, 211, 238, 0.24);
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.08), transparent 32%),
                  radial-gradient(circle at 80% 10%, rgba(249, 115, 22, 0.08), transparent 26%),
                  linear-gradient(145deg, #0a0f1f 0%, #0f172a 58%, #0b1224 100%);
      color: var(--text);
      padding: 32px 24px 64px;
    }
    a { color: inherit; text-decoration: none; }
    html { scroll-behavior: smooth; }
    header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 12px;
      z-index: 20;
      background: transparent;
      backdrop-filter: blur(10px);
      border: none;
      border-radius: 14px;
      padding: 8px 12px;
      width: 100%;
    }
    .back-btn {
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.25);
      background: transparent;
      color: var(--text);
      font-weight: 800;
      box-shadow: none;
      white-space: nowrap;
      align-self: flex-start;
      transition: transform 180ms ease, box-shadow 200ms ease, border-color 180ms ease, background 200ms ease;
    }
    .back-btn:hover {
      transform: translateY(-1px) scale(1.02);
      border-color: rgba(34,211,238,0.35);
      background: rgba(34,211,238,0.06);
      box-shadow: 0 0 0 6px rgba(34,211,238,0.12);
    }
    .back-btn .arrow { font-weight: 900; }
    .save-btn {
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.28);
      background: linear-gradient(135deg, var(--accent), var(--accent-hot));
      color: #0b1224;
      font-weight: 900;
      font-size: 15px;
      box-shadow: 0 14px 28px rgba(34,211,238,0.28);
      white-space: nowrap;
      transition: transform 180ms ease, box-shadow 200ms ease;
    }
    .save-btn:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 0 0 6px rgba(34,211,238,0.20), 0 14px 32px rgba(34,211,238,0.35);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 6px rgba(34,211,238,0.20), 0 14px 32px rgba(34,211,238,0.35); }
      50% { box-shadow: 0 0 0 10px rgba(34,211,238,0.10), 0 14px 36px rgba(34,211,238,0.38); }
      100% { box-shadow: 0 0 0 6px rgba(34,211,238,0.20), 0 14px 32px rgba(34,211,238,0.35); }
    }
    main { max-width: 900px; margin: 0 auto; display: grid; gap: 18px; }
    .status {
      max-width: 1200px;
      margin: 0 auto 12px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-weight: 600;
    }
    .questions { display: grid; gap: 16px; }
    .question-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 18px 16px;
      box-shadow: 0 16px 42px rgba(0,0,0,0.25);
      display: grid;
      gap: 12px;
    }
    .question-box {
      background: linear-gradient(135deg, rgba(34,211,238,0.08), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      min-height: 64px;
    }
    .q-num {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-hot));
      color: #0b1224;
      box-shadow: 0 8px 18px rgba(34,211,238,0.28);
      flex-shrink: 0;
    }
    .prompt-wrap { display: grid; gap: 6px; }
    .prompt { font-size: 16px; line-height: 1.5; font-weight: 600; color: #f8fbff; }
    .category { font-size: 12px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); font-weight: 700; white-space: nowrap; }
    .clear-btn {
      justify-self: end;
      align-self: center;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px dashed rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
    }
    .clear-btn:hover { border-color: var(--accent); color: #f8fbff; background: rgba(34,211,238,0.08); }
    .free-response {
      display: grid;
      gap: 10px;
    }
    .free-response textarea {
      width: 100%;
      min-height: 120px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      padding: 12px;
      resize: vertical;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .free-response textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 8px 22px var(--glow);
    }
    .helper { color: var(--muted); font-size: 13px; }
    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .option {
      position: relative;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
      overflow: hidden;
    }
    .option:hover {
      transform: translateY(-2px) scale(1.01);
      border-color: var(--accent);
      box-shadow: 0 12px 28px var(--glow);
      background: rgba(34,211,238,0.06);
    }
    .option.selected {
      border-color: var(--accent);
      box-shadow: 0 12px 30px var(--glow);
      background: rgba(34,211,238,0.08);
    }
    .option.open, .option:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 12px 30px var(--glow);
      outline: none;
    }
    .option-label {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
      display: block;
    }
    .slider-wrap {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(255,255,255,0.15);
      max-height: 0;
      opacity: 0;
      pointer-events: none;
      transition: max-height 220ms ease, opacity 180ms ease;
    }
    .option.open .slider-wrap {
      max-height: 180px;
      opacity: 1;
      pointer-events: auto;
    }
    .confidence-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .confidence-value { color: #f8fbff; font-weight: 700; }
    .range {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      --slider-fill: 0%;
      -webkit-appearance: none;
      appearance: none;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--slider-fill), rgba(255,255,255,0.12) var(--slider-fill), rgba(255,255,255,0.12) 100%);
    }
    .range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #0b1224;
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 4px rgba(34,211,238,0.18);
      transition: transform 140ms ease, box-shadow 140ms ease;
    }
    .range:active::-webkit-slider-thumb {
      transform: scale(1.08);
      box-shadow: 0 0 0 6px rgba(34,211,238,0.28);
    }
    .range::-moz-range-track {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--slider-fill), rgba(255,255,255,0.12) var(--slider-fill), rgba(255,255,255,0.12) 100%);
    }
    .range::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #0b1224;
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 4px rgba(34,211,238,0.18);
      transition: transform 140ms ease, box-shadow 140ms ease;
    }
    .range:active::-moz-range-thumb {
      transform: scale(1.08);
      box-shadow: 0 0 0 6px rgba(34,211,238,0.28);
    }
    .ticks {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      gap: 6px;
    }
    .ticks span:first-child::after { content: " unsure"; color: var(--muted); }
    .ticks span:last-child::after { content: " I'm sure"; color: var(--muted); }
    .question-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .question-actions {
      display: inline-flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .nav-btn {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(34,211,238,0.08);
      transform: translateY(-1px);
    }
    .nav-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .pager {
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    .persona-switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04);
    }
    .persona-switch label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .persona-switch select {
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      background: rgba(12, 21, 42, 0.9);
      color: var(--text);
      padding: 7px 10px;
      min-width: 170px;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 640px) {
      body { padding: 22px 18px 48px; }
      header { flex-direction: column; align-items: flex-start; }
      .options { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
      .question-box { padding: 12px 14px; }
      .persona-switch { width: 100%; justify-content: space-between; }
      .persona-switch select { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <a id="backToAnalyze" class="back-btn" href="analyze.html"><span class="arrow">←</span><span>Back to Analyze</span></a>
    <div class="pager" id="pager"></div>
    <div class="persona-switch">
      <label for="personaSelector">Persona</label>
      <select id="personaSelector" aria-label="Select persona workspace"></select>
    </div>
    <button id="reviewBtn" class="nav-btn" type="button">Review all answers</button>
  </header>

  <div id="status" class="status" aria-live="polite">Loading questions…</div>

  <main>
    <div id="personality" class="questions" style="scroll-margin-top: 120px;"></div>
  </main>

  <script src="js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.syntraeSupabaseClient = window.syntraeSupabaseClient || window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );
  </script>
  <script>
    const DATASET_PATH = '/data/Identitybuilder.json';
    const personalityRoot = document.getElementById('personality');
    const backToAnalyze = document.getElementById('backToAnalyze');
    const pagerEl = document.getElementById('pager');
    const personaSelectorEl = document.getElementById('personaSelector');
    const reviewBtn = document.getElementById('reviewBtn');
    const STORAGE_KEY = 'persona-answers';
    const SESSION_KEY = 'persona-visible-session';
    const statusEl = document.getElementById('status');
    const PERSONA_TABLE = 'personas';
    const ACTIVE_PERSONA_KEY_STORAGE = 'active-persona-key';
    const PERSONA_QUERY_PARAM = 'persona';
    const syntraeSupabase = window.syntraeSupabaseClient || null;

    const fallbackQuestions = [];
    let allQuestions = [];
    let questionMap = new Map();
    let visibleIds = [];
    let currentIndex = 0;
    let hasUnsaved = false;
    let reviewMode = false;
    let axisMeta = { L1: {}, L2: {}, L3: {} };
    let cloudHydrated = false;
    let cloudHydrating = false;
    let cloudSaveTimer = null;
    let lastCloudPayload = '';
    let personaKey = 'default';

    function sanitizePersonaKey(value) {
      const normalized = String(value || '').trim().toLowerCase();
      if (!normalized) return '';
      const cleaned = normalized.replace(/[^a-z0-9_-]/g, '');
      return cleaned || '';
    }

    function resolvePersonaKey() {
      const params = new URLSearchParams(window.location.search);
      const fromQuery = sanitizePersonaKey(params.get(PERSONA_QUERY_PARAM));
      const fromStorage = sanitizePersonaKey(localStorage.getItem(ACTIVE_PERSONA_KEY_STORAGE));
      const key = fromQuery || fromStorage || 'default';
      localStorage.setItem(ACTIVE_PERSONA_KEY_STORAGE, key);
      return key;
    }

    function buildPersonaUrl(path, key = personaKey) {
      const safeKey = sanitizePersonaKey(key) || 'default';
      return `${path}?${PERSONA_QUERY_PARAM}=${encodeURIComponent(safeKey)}`;
    }

    function normalizePersonaName(name) {
      const trimmed = String(name || '').trim();
      return trimmed || 'Persona 1';
    }

    function extractTraitsFromState(state) {
      const traits = {};
      if (!state || typeof state !== 'object') return traits;
      ['L1', 'L2', 'L3'].forEach((layerId) => {
        const raw = state.identityLayers && state.identityLayers[layerId];
        if (typeof raw !== 'string' || !raw) return;
        try {
          traits[layerId] = JSON.parse(raw);
        } catch (_) {
          traits[layerId] = { raw };
        }
      });
      return traits;
    }

    function clearPersonaLocalState() {
      localStorage.removeItem('persona-name');
      localStorage.removeItem('persona-portrait');
      localStorage.removeItem('persona-avatar-present');
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem('users-input');
      Object.keys(localStorage).forEach((key) => {
        if (key.startsWith('identity-layer-') || key.startsWith('extra-')) {
          localStorage.removeItem(key);
        }
      });
    }

    async function loadPersonaSelector() {
      if (!syntraeSupabase || !personaSelectorEl) return;
      try {
        const { data: authData, error: authError } = await syntraeSupabase.auth.getUser();
        if (authError || !authData?.user) return;
        const { data: rows, error } = await syntraeSupabase
          .from(PERSONA_TABLE)
          .select('persona_key, name, updated_at')
          .eq('user_id', authData.user.id)
          .order('updated_at', { ascending: false });

        if (error) {
          console.warn('Could not load persona selector options:', error.message || error);
          return;
        }

        const personas = Array.isArray(rows) ? rows : [];
        personaSelectorEl.innerHTML = '';
        if (!personas.length) {
          const fallback = document.createElement('option');
          fallback.value = personaKey;
          fallback.textContent = 'Default persona';
          personaSelectorEl.appendChild(fallback);
          return;
        }

        const hasCurrent = personas.some((p) => sanitizePersonaKey(p.persona_key) === personaKey);
        const activeKey = hasCurrent ? personaKey : sanitizePersonaKey(personas[0].persona_key) || 'default';
        personaKey = activeKey;
        localStorage.setItem(ACTIVE_PERSONA_KEY_STORAGE, personaKey);
        backToAnalyze.href = buildPersonaUrl('analyze.html', personaKey);

        personas.forEach((persona) => {
          const key = sanitizePersonaKey(persona.persona_key) || 'default';
          const option = document.createElement('option');
          option.value = key;
          option.textContent = persona.name || key;
          personaSelectorEl.appendChild(option);
        });
        personaSelectorEl.value = personaKey;
      } catch (err) {
        console.warn('Could not load persona selector options:', err);
      }
    }

    function collectPersonaState() {
      const state = {
        version: 1,
        savedAt: new Date().toISOString(),
        personaName: localStorage.getItem('persona-name') || '',
        personaPortrait: localStorage.getItem('persona-portrait') || '',
        personaAvatarPresent: localStorage.getItem('persona-avatar-present') || '',
        answers: loadStoredAnswers(),
        session: loadSession(),
        usersInput: localStorage.getItem('users-input') || '',
        identityLayers: {},
        extras: {}
      };
      ['L1', 'L2', 'L3'].forEach((layerId) => {
        const raw = localStorage.getItem(`identity-layer-${layerId}`);
        if (raw) state.identityLayers[layerId] = raw;
      });
      Object.keys(localStorage).forEach((key) => {
        if (!key.startsWith('extra-')) return;
        state.extras[key.slice(6)] = localStorage.getItem(key) || '';
      });
      return state;
    }

    function applyPersonaState(state) {
      if (!state || typeof state !== 'object') return;
      if (state.personaName) localStorage.setItem('persona-name', state.personaName);
      if (state.personaPortrait) localStorage.setItem('persona-portrait', state.personaPortrait);
      if (state.personaAvatarPresent) localStorage.setItem('persona-avatar-present', state.personaAvatarPresent);

      if (state.answers && typeof state.answers === 'object') {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.answers));
      }
      if (state.session && typeof state.session === 'object') {
        localStorage.setItem(SESSION_KEY, JSON.stringify(state.session));
      }
      if (typeof state.usersInput === 'string' && state.usersInput) {
        localStorage.setItem('users-input', state.usersInput);
      }
      ['L1', 'L2', 'L3'].forEach((layerId) => {
        const raw = state.identityLayers && state.identityLayers[layerId];
        if (typeof raw === 'string' && raw) {
          localStorage.setItem(`identity-layer-${layerId}`, raw);
        }
      });

      Object.keys(localStorage).forEach((key) => {
        if (key.startsWith('extra-')) localStorage.removeItem(key);
      });
      if (state.extras && typeof state.extras === 'object') {
        Object.entries(state.extras).forEach(([field, value]) => {
          localStorage.setItem(`extra-${field}`, String(value || ''));
        });
      }
    }

    async function hydrateFromAccount() {
      if (cloudHydrated || !syntraeSupabase) return;
      cloudHydrated = true;
      cloudHydrating = true;
      try {
        const { data, error } = await syntraeSupabase.auth.getUser();
        if (error || !data?.user) return;
        const user = data.user;

        const { data: personaRow, error: personaError } = await syntraeSupabase
          .from(PERSONA_TABLE)
          .select('state, name, portrait_data_url')
          .eq('user_id', user.id)
          .eq('persona_key', personaKey)
          .maybeSingle();

        if (personaError) {
          console.warn('Persona hydrate from table failed:', personaError.message || personaError);
        }

        if (personaRow && personaRow.state && typeof personaRow.state === 'object') {
          const cloudState = { ...personaRow.state };
          if (personaRow.name && !cloudState.personaName) cloudState.personaName = personaRow.name;
          if (personaRow.portrait_data_url && !cloudState.personaPortrait) {
            cloudState.personaPortrait = personaRow.portrait_data_url;
          }
          applyPersonaState(cloudState);
          lastCloudPayload = JSON.stringify(cloudState);
          return;
        }
        clearPersonaLocalState();
        lastCloudPayload = '';

      } catch (err) {
        console.warn('Persona hydrate failed:', err);
      } finally {
        cloudHydrating = false;
      }
    }

    async function savePersonaToCloudNow() {
      if (cloudHydrating || !syntraeSupabase) return;
      try {
        const { data, error: userError } = await syntraeSupabase.auth.getUser();
        if (userError || !data?.user) return;

        const payload = collectPersonaState();
        const serialized = JSON.stringify(payload);
        if (serialized === lastCloudPayload) return;
        const personaName = normalizePersonaName(payload.personaName);
        const portraitDataUrl = payload.personaPortrait || null;
        const traits = extractTraitsFromState(payload);

        const { error } = await syntraeSupabase.from(PERSONA_TABLE).upsert({
          user_id: data.user.id,
          persona_key: personaKey,
          name: personaName,
          portrait_data_url: portraitDataUrl,
          state: payload,
          traits
        }, {
          onConflict: 'user_id,persona_key'
        });
        if (error) {
          console.warn('Persona save failed:', error.message || error);
          return;
        }
        lastCloudPayload = serialized;
      } catch (err) {
        console.warn('Persona save failed:', err);
      }
    }

    function queueCloudSave(immediate = false) {
      if (cloudHydrating || !syntraeSupabase) return Promise.resolve();
      if (immediate) {
        clearTimeout(cloudSaveTimer);
        return savePersonaToCloudNow();
      }
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(() => {
        void savePersonaToCloudNow();
      }, 650);
      return Promise.resolve();
    }

    personaKey = resolvePersonaKey();
    backToAnalyze.href = buildPersonaUrl('analyze.html');
    if (personaSelectorEl) {
      personaSelectorEl.addEventListener('change', () => {
        const selectedKey = sanitizePersonaKey(personaSelectorEl.value) || 'default';
        if (selectedKey === personaKey) return;

    function saveAxisAggregates() {
      // Compute averages per axis for layers 1-3
      const layerBuckets = { L1: {}, L2: {}, L3: {} };
      Object.values(currentAnswers).forEach(ans => {
        if (!ans || !ans.axisId || !ans.layerId) return;
        if (!layerBuckets[ans.layerId]) return;
        const bucket = layerBuckets[ans.layerId];
        if (!bucket[ans.axisId]) bucket[ans.axisId] = [];
        if (typeof ans.value === 'number') bucket[ans.axisId].push(ans.value);
      });
      ['L1','L2','L3'].forEach(layerId => {
        const result = {};
        const bucket = layerBuckets[layerId];
        Object.keys(bucket).forEach(axisId => {
          const vals = bucket[axisId];
          if (vals.length) {
            const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
            result[axisId] = { value: avg };
          }
        });
        localStorage.setItem(`identity-layer-${layerId}`, JSON.stringify(result));
      });
      queueCloudSave();
    }

    }

    async function loadQuestions() {
      try {
        await hydrateFromAccount();
        currentAnswers = loadStoredAnswers();
        saveAxisAggregates();

        statusEl.textContent = 'Loading questions…';
        const res = await fetch(DATASET_PATH, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Fetch failed (${res.status}) for ${DATASET_PATH}`);
        const data = await res.json();
        const answerScale = (data.ui_defaults && data.ui_defaults.answer_scale && data.ui_defaults.answer_scale.options) || [];
        const labelToValue = {};
        answerScale.forEach(o => { if (o.label != null && o.value != null) labelToValue[o.label] = o.value; });

        const questions = [];
        const layers = Array.isArray(data.layers) ? data.layers : [];

        layers.forEach(layer => {
          if (['L1','L2','L3'].includes(layer.layer_id) && Array.isArray(layer.axes)) {
            layer.axes.forEach(axis => {
              (axis.questions || []).forEach(q => {
                const opts = (q.options || []).map(o => ({
                  label: o.label || o,
                  text: o.text || '',
                  value: labelToValue[o.label] != null ? labelToValue[o.label] : null
                }));
                questions.push({
                  id: q.question_id,
                  prompt: q.text,
                  category: axis.name || '',
                  type: 'choice',
                  options: opts,
                  axisId: axis.axis_id,
                  layerId: layer.layer_id
                });
              });
            });
          } else if (layer.layer_id === 'L4') {
            (layer.axes || []).forEach(axis => {
              (axis.questions || []).forEach(q => {
                questions.push({
                  id: q.question_id,
                  prompt: q.scenario_text || q.scenario_label || axis.name || 'Select adjectives',
                  category: '',
                  type: 'multi',
                  options: q.adjectives || [],
                  axisId: axis.axis_id,
                  layerId: layer.layer_id
                });
              });
            });
          } else if (layer.layer_id === 'L5') {
            (layer.sections || []).forEach(section => {
              (section.fields || []).forEach(field => {
                questions.push({
                  id: field.field_id,
                  prompt: field.prompt || field.name,
                  category: section.name || '',
                  type: 'free',
                  placeholder: field.placeholder || (field.examples ? field.examples.join(', ') : ''),
                  sectionId: section.section_id,
                  layerId: layer.layer_id
                });
              });
            });
          }
        });

        if (data.extra_information && Array.isArray(data.extra_information.fields)) {
          data.extra_information.fields.forEach(f => {
            questions.push({
              id: f.id,
              prompt: f.name,
              category: 'Extra Information',
              type: 'free',
              placeholder: f.placeholder || '',
              extraField: f.id.replace(/^extra_/, '').replace(/_/g, '-'),
              layerId: 'EXTRA'
            });
          });
        }

        if (!questions.length) throw new Error('Malformed databank');

        allQuestions = questions;
        questionMap = new Map(allQuestions.map((q) => [q.id, q]));
        const session = loadSession();
        visibleIds = Array.isArray(session.visibleIds) && session.visibleIds.length
          ? session.visibleIds.filter(id => questionMap.has(id))
          : questions.map(q => q.id);
        currentIndex = Number.isInteger(session.currentIndex) ? Math.max(0, Math.min(session.currentIndex, visibleIds.length - 1)) : 0;
        saveSession({ visibleIds, currentIndex });
        renderCurrentQuestion();
      } catch (err) {
        console.warn('Could not load databank:', err);
        const msg = err && err.message ? err.message : err;
        statusEl.textContent = `Question set unavailable — ensure /data/Identitybuilder.json is reachable. (${msg})`;
        allQuestions = [];
        questionMap = new Map();
        visibleIds = [];
        personalityRoot.innerHTML = '';
        console.error('Load failure details:', err);
      }
    }

    // Surface unexpected runtime errors to the UI for debugging
    window.addEventListener('error', (e) => {
      if (statusEl) statusEl.textContent = `Error: ${e.message}`;
    });
    window.addEventListener('unhandledrejection', (e) => {
      if (statusEl) statusEl.textContent = `Unhandled: ${e.reason}`;
    });
    reviewBtn.addEventListener('click', () => {
      // Toggle between compact (one-at-a-time) and extended (all-at-once) views
      reviewMode = !reviewMode;
      reviewBtn.textContent = reviewMode ? 'Return to compact view' : 'Review all answers';
      if (reviewMode) renderAllQuestions(); else renderCurrentQuestion();
    });

    loadQuestions().catch((e) => {
      console.error('loadQuestions rejected:', e);
      if (statusEl) statusEl.textContent = `Load failed: ${e && e.message ? e.message : e}`;
    });
  </script>
  <script>
    // Helper to prompt for saving when navigating away
    function promptSaveIfNeeded(next) {
      if (!hasUnsaved) {
        next();
        return;
      }
      const doSave = confirm('You have unsaved changes. Save before continuing?');
      if (doSave) {
        saveAnswers();
        saveUsersInput();
        saveAxisAggregates();
        hasUnsaved = false;
      }
      next();
    }

    // Apply to Back to Analyze navigation — auto-save without prompting
    backToAnalyze.addEventListener('click', async (e) => {
      e.preventDefault();
      if (hasUnsaved) {
        saveAnswers();
        saveUsersInput();
        saveAxisAggregates();
        hasUnsaved = false;
      }
      await queueCloudSave(true);
      window.location.href = backToAnalyze.href;
    });

    // Apply on tab close / reload
    window.addEventListener('beforeunload', () => {
      if (!hasUnsaved) return;
      // Auto-save without prompting so both “stay” and “leave” paths persist data.
      saveAnswers();
      saveUsersInput();
      saveAxisAggregates();
      hasUnsaved = false;
    });
  </script>
</body>
</html>
