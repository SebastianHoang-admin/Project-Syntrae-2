<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntrae - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --ink: #0b1224;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-strong: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.12);
            --accent: #22d3ee;
            --accent-hot: #f97316;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.08), transparent 30%),
                        radial-gradient(circle at 80% 10%, rgba(249, 115, 22, 0.08), transparent 25%),
                        linear-gradient(145deg, #0a0f1f 0%, #0f172a 60%, #0b1224 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* Decorative animation layers removed */

        .header {
            position: sticky;
            top: 0;
            z-index: 2;
            background: rgba(0, 0, 0, 0.06);
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(4px);
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand-link { text-decoration: none; color: inherit; display: inline-flex; }

        .logo-icon {
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(135deg, #f84f25, #b8120e);
            box-shadow: 0 12px 30px rgba(248, 79, 37, 0.35);
            padding: 6px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .logo-text span:first-child {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logo-text span:last-child {
            font-size: 14px;
            color: var(--muted);
        }

        .more-menu {
            position: relative;
            z-index: 20;
        }

        .more-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 52px;
            height: 52px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .more-btn:hover {
            transform: translateY(-2px) scale(1.01);
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 14px 40px rgba(34, 211, 238, 0.25);
        }

        .more-btn .line {
            width: 22px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-hot));
            border-radius: 999px;
            transition: all 0.3s ease;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 12px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            min-width: 240px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.25s ease;
            overflow: hidden;
            z-index: 50;
        }

        .dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.2s ease;
            border-bottom: 1px solid var(--border);
        }

        .dropdown-item:hover {
            background: rgba(34, 211, 238, 0.08);
            padding-left: 22px;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item.sign-out {
            color: #fca5a5;
        }

        .dropdown-item.sign-out i {
            color: #fca5a5;
        }

        #dropdownMenu {
            isolation: isolate;
        }

        #dropdownMenu.active {
            overflow: visible;
            border-color: rgba(18, 150, 141, 0.22) !important;
            background: rgba(255, 255, 255, 0.98) !important;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.92),
                0 16px 34px rgba(32, 50, 54, 0.14),
                0 0 26px rgba(255, 255, 255, 0.86),
                0 0 62px rgba(223, 244, 237, 0.72),
                0 0 104px rgba(18, 150, 141, 0.22) !important;
        }

        #dropdownMenu::before,
        #dropdownMenu::after {
            content: '';
            position: absolute;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.26s ease, transform 0.45s ease;
        }

        #dropdownMenu::before {
            inset: -26px;
            z-index: -1;
            border-radius: 18px;
            background:
                radial-gradient(circle at 52% 4%, rgba(255, 255, 255, 0.96), rgba(223, 244, 237, 0.74) 32%, rgba(18, 150, 141, 0.18) 58%, transparent 74%);
            filter: blur(10px);
            transform: scale(0.94);
        }

        #dropdownMenu::after {
            inset: 0;
            z-index: 0;
            border-radius: inherit;
            background:
                radial-gradient(circle at 84% 10%, rgba(255, 255, 255, 0.86), rgba(223, 244, 237, 0.34) 28%, transparent 54%),
                radial-gradient(circle at 10% 92%, rgba(243, 201, 79, 0.18), transparent 48%);
            transform: translate3d(-8px, 8px, 0) scale(0.96);
        }

        #dropdownMenu.active::before,
        #dropdownMenu.active::after {
            opacity: 0.46;
            transform: translate3d(0, 0, 0) scale(1);
        }

        #dropdownMenu.active:hover::before,
        #dropdownMenu.active:hover::after {
            opacity: 1;
        }

        #dropdownMenu.active:hover::before {
            animation: dashboard-menu-glow 2.2s ease-in-out infinite alternate;
        }

        #dropdownMenu .dropdown-item {
            position: relative;
            z-index: 1;
        }

        @keyframes dashboard-menu-glow {
            from {
                filter: blur(10px);
                transform: scale(1);
            }
            to {
                filter: blur(14px);
                transform: scale(1.025);
            }
        }

        .fas::before {
            display: inline-block;
            font-style: normal;
            font-weight: 800;
            line-height: 1;
        }

        .fa-user-pen::before,
        .fa-pen::before { content: "✎"; }
        .fa-trash::before { content: "🗑"; }
        .fa-id-card::before { content: "▣"; }
        .fa-desktop::before { content: "▤"; }
        .fa-crown::before { content: "♛"; }
        .fa-sign-out-alt::before { content: "⇥"; }
        .fa-user-circle::before { content: "●"; }
        .fa-plus::before { content: "+"; }
        .fa-comments::before { content: "◌"; }
        .fa-paper-plane::before { content: "➤"; }
        .fa-play::before { content: "▶"; }
        .fa-check::before { content: "✓"; }
        .fa-heart::before { content: "♥"; }
        .fa-lock::before { content: "⌾"; }
        .fa-route::before { content: "↝"; }
        .fa-seedling::before { content: "⌁"; }
        .fa-sliders::before { content: "≡"; }
        .fa-lightbulb::before { content: "◉"; }

        .account-indicator {
            margin-right: 14px;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-indicator[data-state="signed-out"] {
            color: #fca5a5;
            border-color: rgba(248, 79, 37, 0.35);
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex: 1;
            padding: 32px;
            gap: 26px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        .persona-column,
        .chat-column {
            background: rgba(255, 255, 255, 0.03);
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 4px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
        }

        .persona-column {
            flex: 0 0 25%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .column-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .column-title i {
            color: var(--accent);
        }

        .persona-samples {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .persona-card {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.12), rgba(249, 115, 22, 0.14));
            border-radius: 14px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            color: var(--text);
            font-weight: 600;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .persona-card:hover {
            transform: scale(1.04);
            box-shadow: 0 18px 36px rgba(34, 211, 238, 0.3);
        }

        .persona-card.active {
            border-color: rgba(34, 211, 238, 0.55);
            box-shadow: 0 18px 36px rgba(34, 211, 238, 0.35);
        }

        .persona-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .persona-card-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .persona-card-actions {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .mini-icon-btn {
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            color: var(--text);
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color .2s ease, background .2s ease, transform .2s ease;
        }

        .mini-icon-btn:hover {
            border-color: rgba(34,211,238,0.5);
            background: rgba(34,211,238,0.18);
            transform: translateY(-1px);
        }

        .persona-create {
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
        }

        .persona-empty {
            color: var(--muted);
            font-size: 13px;
            border: 1px dashed rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .chat-session-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .chat-session-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .chat-session-meta strong {
            color: var(--text);
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        .chat-session-list {
            display: grid;
            gap: 8px;
            max-height: 160px;
            overflow: auto;
            padding-right: 4px;
        }

        .chat-session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            text-align: left;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            padding: 10px 12px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .chat-session-item:hover {
            transform: translateY(-1px);
            border-color: rgba(34, 211, 238, 0.45);
            background: rgba(34, 211, 238, 0.08);
        }

        .chat-session-item.active {
            border-color: rgba(34, 211, 238, 0.65);
            background: rgba(34, 211, 238, 0.12);
        }

        .chat-session-title {
            font-weight: 600;
            font-size: 13px;
        }

        .chat-session-time {
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .chat-session-actions {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .nav-btn {
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            padding: 10px 12px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease, background .2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(34,211,238,0.45);
            background: rgba(34,211,238,0.1);
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .agent-avatar {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, var(--accent), var(--accent-hot));
            border-radius: 16px;
            display: grid;
            place-items: center;
            color: #0b1224;
            font-size: 20px;
            font-weight: 800;
            box-shadow: 0 12px 30px rgba(34, 211, 238, 0.35);
        }

        .agent-info h3 {
            color: var(--text);
            margin-bottom: 4px;
            font-size: 17px;
        }

        .agent-info p {
            color: var(--muted);
            font-size: 13px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
            box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.35);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.35); }
            70% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .message {
            max-width: 78%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(8px);
            animation: pop-in 0.35s ease forwards;
        }

        .message.agent .message-content {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 16px 16px 16px 8px;
        }

        .message.user {
            margin-left: auto;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--accent), var(--accent-hot));
            color: #0b1224;
            border-radius: 16px 16px 8px 16px;
            border: none;
            box-shadow: 0 12px 30px rgba(34, 211, 238, 0.35);
        }

        .message-content {
            padding: 15px 18px;
            font-size: 15px;
            line-height: 1.6;
            border: 1px solid transparent;
        }

        .message-time {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
        }

        @keyframes pop-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .demo-mode .container {
            max-width: 1680px;
            gap: 22px;
            padding-top: 24px;
        }

        .demo-mode .persona-column {
            flex: 0 0 30%;
        }

        .demo-mode .chat-column {
            min-height: 760px;
        }

        .demo-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            padding: 8px 10px;
            border: 1px solid rgba(18, 150, 141, 0.18);
            border-radius: 999px;
            background: rgba(223, 244, 237, 0.72);
            color: var(--leaf);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .demo-persona-card {
            display: grid;
            gap: 14px;
            padding: 18px;
            border: 1px solid rgba(32, 50, 54, 0.12);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 14px 34px rgba(32, 50, 54, 0.08);
        }

        .demo-persona-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .demo-persona-avatar {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 900;
            font-size: 20px;
            background: linear-gradient(135deg, var(--leaf), var(--teal) 54%, var(--coral));
            box-shadow: 0 14px 26px rgba(45, 125, 103, 0.18);
            overflow: hidden;
            border: 2px solid rgba(251, 255, 248, 0.9);
        }

        .demo-persona-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .demo-persona-head h3,
        .demo-card h3,
        .tree-card h4 {
            color: var(--ink);
        }

        .demo-persona-head p,
        .demo-card p,
        .tree-card p,
        .demo-small,
        .outcome-list li {
            color: var(--quiet);
        }

        .demo-chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .demo-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 999px;
            border: 1px solid rgba(32, 50, 54, 0.12);
            background: rgba(251, 255, 248, 0.9);
            color: var(--ink);
            font-size: 12px;
            font-weight: 800;
        }

        .demo-side-note {
            padding: 14px;
            border-left: 4px solid var(--sun);
            border-radius: 12px;
            background: rgba(243, 201, 79, 0.12);
            color: var(--ink);
            line-height: 1.55;
        }

        .demo-stage {
            display: grid;
            gap: 18px;
        }

        .demo-hero {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.9fr);
            gap: 18px;
            align-items: stretch;
        }

        .demo-card {
            border: 1px solid rgba(32, 50, 54, 0.12);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 16px 38px rgba(32, 50, 54, 0.08);
            padding: 18px;
        }

        .demo-card h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .demo-prompt-box {
            min-height: 132px;
            margin-top: 14px;
            padding: 16px;
            border: 1px solid rgba(32, 50, 54, 0.14);
            border-radius: 14px;
            background: linear-gradient(180deg, #fbfff8 0%, #f4fbf7 100%);
            color: var(--ink);
            font-size: 17px;
            line-height: 1.55;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .demo-candidate-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .candidate-card {
            padding: 12px;
            border: 1px solid rgba(18, 150, 141, 0.2);
            border-radius: 12px;
            background: rgba(223, 244, 237, 0.5);
            display: grid;
            gap: 10px;
        }

        .candidate-card strong {
            display: block;
            color: var(--ink);
            margin-bottom: 0;
        }

        .demo-persona-switcher {
            display: grid;
            gap: 10px;
            margin: 14px 0;
        }

        .demo-persona-option {
            width: 100%;
            border: 1px solid rgba(32, 50, 54, 0.12);
            border-radius: 14px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.86);
            color: var(--ink);
            text-align: left;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(32, 50, 54, 0.06);
            transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        }

        .demo-persona-option:hover,
        .demo-persona-option.active {
            transform: translateY(-2px);
            border-color: rgba(18, 150, 141, 0.36);
            box-shadow: 0 16px 34px rgba(32, 50, 54, 0.1);
        }

        .demo-persona-option strong {
            display: block;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .demo-persona-option span {
            color: var(--quiet);
            font-size: 12px;
            font-weight: 700;
        }

        .demo-persona-list {
            display: grid;
            gap: 10px;
        }

        .demo-persona-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(32, 50, 54, 0.12);
            border-radius: 14px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.88);
            color: var(--ink);
            box-shadow: 0 10px 24px rgba(32, 50, 54, 0.06);
            transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, opacity 0.22s ease;
        }

        .demo-persona-row:hover,
        .demo-persona-row.active {
            transform: translateY(-2px);

    <script type="module">
        import { supabase } from './js/supabase-client.js';

        const moreBtn = document.getElementById('moreBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const signOutLink = document.getElementById('signOutLink');
        const accountIndicator = document.getElementById('accountIndicator');
        const chatInput = document.getElementById('chatInput');
        const chatMessages = document.getElementById('chatMessages');
        const sendBtn = document.getElementById('sendBtn');
        const personaListEl = document.getElementById('personaList');
        const createPersonaBtn = document.getElementById('createPersonaBtn');
        const chatSessionListEl = document.getElementById('chatSessionList');
        const newChatBtn = document.getElementById('newChatBtn');
        const activePersonaLabel = document.getElementById('activePersonaLabel');

        const PERSONA_TABLE = 'personas';
        const CHAT_SESSION_TABLE = 'persona_chat_sessions';
        const CHAT_MESSAGE_TABLE = 'persona_chat_messages';
        const PERSONA_PORTRAITS_BUCKET = 'persona-portraits';
        const ACTIVE_PERSONA_KEY_STORAGE = 'active-persona-key';
        const PERSONA_QUERY_PARAM = 'persona';
        const CHAT_QUERY_PARAM = 'chat';
        const EMPTY_PERSONA_SCOPE = '__none__';
        const DECISION_TREE_DEMO = 'decision-tree';

        let currentUser = null;
        let personas = [];
        let activePersona = null;
        let chatSessions = [];
        let activeSession = null;
        let activeMessages = [];
        let isSending = false;

        function isDecisionTreeDemo() {
            const params = new URLSearchParams(window.location.search);
            return params.get('demo') === DECISION_TREE_DEMO;
        }

        function demoUrl(path, params = {}) {
            const url = new URL(path, window.location.href);
            url.searchParams.set('demo', DECISION_TREE_DEMO);
            const currentParams = new URLSearchParams(window.location.search);
            const guided = currentParams.get('tour');
            if (guided) {
                url.searchParams.set('tour', guided);
            }
            Object.entries(params).forEach(([key, value]) => {
                if (value !== undefined && value !== null && value !== '') {
                    url.searchParams.set(key, String(value));
                }
            });
            return `${url.pathname.split('/').pop()}?${url.searchParams.toString()}`;
        }

        function getDemoState() {
            const params = new URLSearchParams(window.location.search);
            return params.get('state') === 'end' ? 'end' : 'start';
        }

        function sanitizePersonaKey(value) {
            const normalized = String(value || '').trim().toLowerCase();
            if (!normalized) return '';
            const cleaned = normalized.replace(/[^a-z0-9_-]/g, '');
            return cleaned || '';
        }

        function createPersonaKeyFromSeed(name, seed = '') {
            const source = String(name || '').replace(/\s+/g, '-');
            let slug = sanitizePersonaKey(source).slice(0, 24) || 'persona';
            if (slug === 'default') slug = 'persona';
            const safeSeed = sanitizePersonaKey(seed).replace(/-/g, '').slice(0, 10) || Date.now().toString(36);
            return `${slug}-${safeSeed}`;
        }

        function createPersonaKey(name) {
            return createPersonaKeyFromSeed(name, Date.now().toString(36));
        }

        function extractPersonaSeed(personaKey) {
            const safe = sanitizePersonaKey(personaKey);
            if (!safe) return '';
            const parts = safe.split('-').filter(Boolean);
            return parts.length ? parts[parts.length - 1] : '';
        }

        function isUniqueKeyError(error) {
            const code = String(error?.code || '').trim();
            const message = String(error?.message || '').toLowerCase();
            return code === '23505' || message.includes('duplicate key') || message.includes('unique');
        }

        async function movePortraitForPersonaKey(persona, nextKey) {
            const oldPath = String(
                persona?.portrait_storage_path
                || (persona?.state && persona.state.personaPortraitPath)
                || ''
            ).trim();
            const oldUrl = String(
                persona?.portrait_data_url
                || (persona?.state && persona.state.personaPortrait)
                || ''
            ).trim();
            if (!oldPath || !currentUser?.id) {
                return { portraitPath: oldPath || null, portraitUrl: oldUrl || null };
            }
            const fileName = oldPath.split('/').pop();
            if (!fileName) {
                return { portraitPath: oldPath || null, portraitUrl: oldUrl || null };
            }
            const nextPath = `${currentUser.id}/${nextKey}/${fileName}`;
            if (nextPath === oldPath) {
                return { portraitPath: oldPath, portraitUrl: oldUrl || null };
            }
            const { error } = await supabase.storage
                .from(PERSONA_PORTRAITS_BUCKET)
                .move(oldPath, nextPath);
            if (error) {
                console.warn('Could not move portrait to renamed persona key:', error.message || error);
                return { portraitPath: oldPath || null, portraitUrl: oldUrl || null };
            }
            const { data } = supabase.storage.from(PERSONA_PORTRAITS_BUCKET).getPublicUrl(nextPath);
            return {
                portraitPath: nextPath,
                portraitUrl: data?.publicUrl || oldUrl || null
            };
        }

        async function migrateLegacyDefaultPersonaKeys(userId) {
            if (!userId) return;
            const { data, error } = await supabase
                .from(PERSONA_TABLE)
                .select('id, name, state')
                .eq('user_id', userId)
                .eq('persona_key', 'default');

            if (error || !Array.isArray(data) || !data.length) return;

            const hadDefaultInUrl = getUrlPersonaKey() === 'default';
            const hadDefaultInStorage = getActivePersonaKey() === 'default';
            let replacementForCurrent = '';

            for (const row of data) {
                const baseName = row?.name || row?.state?.personaName || 'persona';
                const nextKey = createPersonaKeyFromSeed(baseName, row.id);
                const { error: updateError } = await supabase
                    .from(PERSONA_TABLE)
                    .update({ persona_key: nextKey })
                    .eq('id', row.id)
                    .eq('user_id', userId);
                if (!updateError && !replacementForCurrent) {
                    replacementForCurrent = nextKey;
                }
            }

            if (!replacementForCurrent) return;
            if (hadDefaultInStorage) {
                localStorage.setItem(ACTIVE_PERSONA_KEY_STORAGE, replacementForCurrent);
            }
            if (hadDefaultInUrl) {
                updateChatUrl(replacementForCurrent, getUrlChatId());
            }
        }

        function buildPersonaUrl(path, key) {
            const safeKey = sanitizePersonaKey(key);
            if (!safeKey) return path;
            return `${path}?${PERSONA_QUERY_PARAM}=${encodeURIComponent(safeKey)}`;
        }

        function getActivePersonaKey() {
            return sanitizePersonaKey(localStorage.getItem(ACTIVE_PERSONA_KEY_STORAGE));
        }

        function getUrlPersonaKey() {
            const params = new URLSearchParams(window.location.search);
            return sanitizePersonaKey(params.get(PERSONA_QUERY_PARAM));
        }

        function getUrlChatId() {
            const params = new URLSearchParams(window.location.search);
            return String(params.get(CHAT_QUERY_PARAM) || '').trim();
        }

        function updateChatUrl(personaKey, sessionId = '') {
            const params = new URLSearchParams(window.location.search);
            const safePersona = sanitizePersonaKey(personaKey);
            if (safePersona) params.set(PERSONA_QUERY_PARAM, safePersona);
            else params.delete(PERSONA_QUERY_PARAM);
            if (sessionId) params.set(CHAT_QUERY_PARAM, sessionId);
            else params.delete(CHAT_QUERY_PARAM);
            const query = params.toString();
            const next = query ? `${window.location.pathname}?${query}` : window.location.pathname;
            window.history.replaceState({}, '', next);
        }

        function getSessionStorageKeyForPersona(personaKey) {
            return `active-chat-session:${sanitizePersonaKey(personaKey) || EMPTY_PERSONA_SCOPE}`;
        }

        function getStoredActiveSessionId(personaKey) {
            return localStorage.getItem(getSessionStorageKeyForPersona(personaKey)) || '';
        }

        function setStoredActiveSessionId(personaKey, sessionId) {
            localStorage.setItem(getSessionStorageKeyForPersona(personaKey), sessionId || '');
        }

        function setActivePersona(persona) {
            activePersona = persona || null;
            if (!activePersona) {
                localStorage.removeItem(ACTIVE_PERSONA_KEY_STORAGE);
                localStorage.removeItem('persona-name');
                activePersonaLabel.textContent = 'None selected';
                return;
            }
            localStorage.setItem(ACTIVE_PERSONA_KEY_STORAGE, activePersona.persona_key);
            localStorage.setItem('persona-name', activePersona.name || 'Persona');
            activePersonaLabel.textContent = activePersona.name || 'Persona';
        }

        function seedPersonaState(name) {
            return {
                version: 1,
                savedAt: new Date().toISOString(),
                personaName: name,
                personaPortrait: '',
                personaPortraitPath: '',
                personaAvatarPresent: '',
                answers: {},
                session: {},
                usersInput: '',
                identityLayers: {},
                extras: {}
            };
        }

        function clearPersonaLocalState() {
            const keys = [
                'persona-name',
                'persona-portrait',
                'persona-portrait-storage-path',
                'persona-avatar-present',
                'persona-answers',
                'persona-visible-session',
                'users-input'
            ];
            keys.forEach((key) => localStorage.removeItem(key));
            Object.keys(localStorage).forEach((key) => {
                if (key.startsWith('identity-layer-') || key.startsWith('extra-')) {
                    localStorage.removeItem(key);
                }
            });
        }

        function applyPersonaStateFromRow(persona) {
            clearPersonaLocalState();
            if (!persona) return;
            const state = persona.state && typeof persona.state === 'object' ? persona.state : {};
            localStorage.setItem('persona-name', state.personaName || persona.name || 'Persona');
            if (state.personaPortrait || persona.portrait_data_url) {
                localStorage.setItem('persona-portrait', state.personaPortrait || persona.portrait_data_url);
            }
            if (state.personaPortraitPath || persona.portrait_storage_path) {
                localStorage.setItem('persona-portrait-storage-path', state.personaPortraitPath || persona.portrait_storage_path);
            }
            if (state.personaAvatarPresent) localStorage.setItem('persona-avatar-present', String(state.personaAvatarPresent));
            if (state.answers && typeof state.answers === 'object') {
                localStorage.setItem('persona-answers', JSON.stringify(state.answers));
            }
            if (state.session && typeof state.session === 'object') {
                localStorage.setItem('persona-visible-session', JSON.stringify(state.session));
            }
            if (state.usersInput) {
                localStorage.setItem('users-input', typeof state.usersInput === 'string' ? state.usersInput : JSON.stringify(state.usersInput));
            }
            ['L1', 'L2', 'L3'].forEach((layerId) => {
                const raw = state.identityLayers && state.identityLayers[layerId];
                if (typeof raw === 'string' && raw) localStorage.setItem(`identity-layer-${layerId}`, raw);
            });
            if (state.extras && typeof state.extras === 'object') {
                Object.entries(state.extras).forEach(([field, value]) => {
                    localStorage.setItem(`extra-${field}`, String(value || ''));
                });
            }
        }

        function formatMessageTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            if (Number.isNaN(d.getTime())) return '';
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatSessionTime(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            if (Number.isNaN(d.getTime())) return '';
            return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function addMessage(text, sender, createdAt) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const timeText = formatMessageTime(createdAt) || formatMessageTime(new Date().toISOString());
            messageDiv.innerHTML = `
                <div class="message-content">${text}</div>
                <div class="message-time">${timeText}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function renderMessages() {
            chatMessages.innerHTML = '';
            if (!activePersona) {
                addMessage('Select a persona to start chatting.', 'agent');
                return;
            }
            if (!activeSession) {
                addMessage(`No chat selected for ${activePersona.name}. Click "New chat" to start.`, 'agent');
                return;
            }
            if (!activeMessages.length) {
                addMessage(`You are chatting with ${activePersona.name}. Ask anything to start.`, 'agent');
                return;
            }
            activeMessages.forEach((msg) => {
                const sender = (msg.role === 'assistant' || msg.role === 'system') ? 'agent' : 'user';
                addMessage(msg.content, sender, msg.created_at);
            });
        }

        function renderPersonaCards() {
            if (!personaListEl) return;
            personaListEl.innerHTML = '';
            if (!personas.length) {
                const empty = document.createElement('div');
                empty.className = 'persona-empty';
                empty.textContent = 'No personas yet. Create one to start.';
                personaListEl.appendChild(empty);
                return;
            }
            const activeKey = activePersona?.persona_key || getActivePersonaKey();
            personas.forEach((persona) => {
                const card = document.createElement('div');
                card.className = `persona-card${persona.persona_key === activeKey ? ' active' : ''}`;
                card.innerHTML = `
                    <div class="persona-card-row">
                        <span class="persona-card-name">${persona.name || 'Persona'}</span>
                        <span class="persona-card-actions">
                            <button type="button" class="mini-icon-btn" data-action="rename" title="Rename persona">${demoIcon('pen')}</button>
                            <button type="button" class="mini-icon-btn" data-action="delete" title="Delete persona">${demoIcon('trash')}</button>
                        </span>
                    </div>
                `;
                card.addEventListener('click', () => {
                    void selectPersona(persona);
                });
                const renameBtn = card.querySelector('[data-action="rename"]');
                const deleteBtn = card.querySelector('[data-action="delete"]');
                renameBtn?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    void renamePersona(persona);
                });
                deleteBtn?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    void deletePersona(persona);
                });
                personaListEl.appendChild(card);
            });
        }

        function renderChatSessionList() {
            if (!chatSessionListEl) return;
            chatSessionListEl.innerHTML = '';
            if (!activePersona) {
                const empty = document.createElement('div');
                empty.className = 'persona-empty';
                empty.textContent = 'Select a persona to see chat windows.';
                chatSessionListEl.appendChild(empty);
                return;
            }
            if (!chatSessions.length) {
                const empty = document.createElement('div');
                empty.className = 'persona-empty';
                empty.textContent = `No chat windows for ${activePersona.name}. Click "New chat".`;
                chatSessionListEl.appendChild(empty);
                return;
            }
            chatSessions.forEach((session) => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = `chat-session-item${activeSession && session.id === activeSession.id ? ' active' : ''}`;
                item.innerHTML = `
                    <span class="chat-session-title">${session.title || 'New chat'}</span>
                    <span class="chat-session-time">${formatSessionTime(session.updated_at || session.created_at)}</span>
                    <span class="chat-session-actions">
                        <span class="mini-icon-btn" data-action="rename" title="Rename chat window">${demoIcon('pen')}</span>
                        <span class="mini-icon-btn" data-action="delete" title="Delete chat window">${demoIcon('trash')}</span>
                    </span>
                `;
                item.addEventListener('click', () => {
                    void openChatSession(session.id);
                });
                const renameBtn = item.querySelector('[data-action="rename"]');
                const deleteBtn = item.querySelector('[data-action="delete"]');
                renameBtn?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    void renameChatSession(session);
                });
                deleteBtn?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    void deleteChatSession(session);
                });
                chatSessionListEl.appendChild(item);
            });
        }

        async function loadMessagesForSession(sessionId) {
            if (!sessionId || !currentUser?.id || !activePersona?.id) return;
            const { data, error } = await supabase
                .from(CHAT_MESSAGE_TABLE)
                .select('id, role, content, created_at')
                .eq('user_id', currentUser.id)
                .eq('persona_id', activePersona.id)
                .eq('session_id', sessionId)
                .order('created_at', { ascending: true });
            if (error) {
                console.warn('Could not load chat messages:', error.message || error);
                activeMessages = [];
                renderMessages();
                return;
            }
            activeMessages = Array.isArray(data) ? data : [];
            renderMessages();
        }

        async function openChatSession(sessionId) {
            const found = chatSessions.find((row) => row.id === sessionId);
            if (!found) return;
            activeSession = found;
            setStoredActiveSessionId(activePersona.persona_key, found.id);
            updateChatUrl(activePersona.persona_key, found.id);
            renderChatSessionList();
            await loadMessagesForSession(found.id);
        }

        async function loadChatSessionsForPersona(personaId) {
            if (!personaId || !currentUser?.id || !activePersona) return;
            const { data, error } = await supabase
                .from(CHAT_SESSION_TABLE)
                .select('id, title, created_at, updated_at')
                .eq('user_id', currentUser.id)
                .eq('persona_id', personaId)
                .order('updated_at', { ascending: false });
            if (error) {
                console.warn('Could not load chat sessions:', error.message || error);
                chatSessions = [];
                activeSession = null;
                activeMessages = [];
                renderChatSessionList();
                renderMessages();
                return;
            }
            chatSessions = Array.isArray(data) ? data : [];
            if (!chatSessions.length) {
                activeSession = null;
                activeMessages = [];
                setStoredActiveSessionId(activePersona.persona_key, '');
                updateChatUrl(activePersona.persona_key, '');
                renderChatSessionList();
                renderMessages();
                return;
            }
            const urlChatId = getUrlChatId();
            const storedId = getStoredActiveSessionId(activePersona.persona_key);
            const preferred = chatSessions.find((row) => row.id === urlChatId)
                || chatSessions.find((row) => row.id === storedId)
                || chatSessions[0];
            await openChatSession(preferred.id);
        }

        async function createNewChat() {
            if (!activePersona || !currentUser?.id) return;
            const { data, error } = await supabase
                .from(CHAT_SESSION_TABLE)
                .insert({
                    user_id: currentUser.id,
                    persona_id: activePersona.id,
                    title: 'New chat',
                    metadata: {}
                })
                .select('id, title, created_at, updated_at')
                .single();
            if (error) {
                alert(`Could not create chat window: ${error.message || error}`);
                return;
            }
            chatSessions = [data, ...chatSessions];
            await openChatSession(data.id);
        }

        async function maybeUpdateSessionTitle(userText) {
            if (!activeSession || !currentUser?.id) return;
            const currentTitle = String(activeSession.title || '').trim().toLowerCase();
            if (currentTitle && currentTitle !== 'new chat') return;
            const newTitle = userText.trim().slice(0, 60) || 'New chat';
            const { error } = await supabase
                .from(CHAT_SESSION_TABLE)
                .update({ title: newTitle })
                .eq('id', activeSession.id)
                .eq('user_id', currentUser.id);
            if (error) return;
            activeSession.title = newTitle;
            chatSessions = chatSessions.map((row) => row.id === activeSession.id ? { ...row, title: newTitle } : row);
            renderChatSessionList();
        }

        async function touchActiveSession() {
            if (!activeSession || !currentUser?.id) return;
            const now = new Date().toISOString();
            const { error } = await supabase
                .from(CHAT_SESSION_TABLE)
                .update({ updated_at: now })
                .eq('id', activeSession.id)
                .eq('user_id', currentUser.id);
            if (error) return;
            activeSession.updated_at = now;
            chatSessions = chatSessions
                .map((row) => row.id === activeSession.id ? { ...row, updated_at: now } : row)
                .sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
            renderChatSessionList();
        }

        async function persistMessage(role, content) {
            if (!activeSession || !activePersona || !currentUser?.id) return;
            const { error } = await supabase.from(CHAT_MESSAGE_TABLE).insert({
                user_id: currentUser.id,
                persona_id: activePersona.id,
                session_id: activeSession.id,
                role,
                content,
                metadata: { persona_key: activePersona.persona_key }
            });
            if (error) {
                console.warn(`Could not save ${role} message:`, error.message || error);
            }
        }

        async function selectPersona(persona) {
            if (!persona) return;
            setActivePersona(persona);
            applyPersonaStateFromRow(persona);
            updateChatUrl(persona.persona_key, '');
            renderPersonaCards();
            await loadChatSessionsForPersona(persona.id);
        }

        async function loadPersonasForUser(userId) {
            const { data, error } = await supabase
                .from(PERSONA_TABLE)
                .select('id, persona_key, name, updated_at, state, profile, portrait_data_url, portrait_storage_path')
                .eq('user_id', userId)
                .order('updated_at', { ascending: false });

            if (error) {
                console.warn('Could not load personas:', error.message || error);
                personas = [];
                setActivePersona(null);
                renderPersonaCards();
                renderChatSessionList();
                renderMessages();
                return;
            }

            personas = Array.isArray(data) ? data : [];
            if (!personas.length) {
                setActivePersona(null);
                renderPersonaCards();
                renderChatSessionList();
                renderMessages();
                return;
            }

            const activeKey = getUrlPersonaKey() || getActivePersonaKey();
            const preferred = personas.find((row) => row.persona_key === activeKey) || personas[0];
            await selectPersona(preferred);
        }

        async function createPersona() {
            if (!currentUser?.id) return;
            const suggested = `Persona ${personas.length + 1}`;
            const input = window.prompt('Enter a name for your new persona:', suggested);
            if (input === null) return;
            const name = (input.trim() || suggested).slice(0, 120);
            const personaKey = createPersonaKey(name);
            const state = seedPersonaState(name);
            const traits = { L1: {}, L2: {}, L3: {} };

            const { error } = await supabase.from(PERSONA_TABLE).insert({
                user_id: currentUser.id,
                persona_key: personaKey,
                name,
                state,
                traits,
                portrait_data_url: null,
                portrait_storage_path: null
            });

            if (error) {
                alert(`Could not create persona: ${error.message || error}`);
                return;
            }

            localStorage.setItem(ACTIVE_PERSONA_KEY_STORAGE, personaKey);
            await loadPersonasForUser(currentUser.id);
        }

        async function renamePersona(persona) {
            if (!persona || !currentUser?.id) return;
            const currentName = String(persona.name || 'Persona').trim() || 'Persona';
            const input = window.prompt('Rename persona:', currentName);
            if (input === null) return;
            const nextName = input.trim().slice(0, 120);
            if (!nextName || nextName === currentName) return;

            const oldKey = sanitizePersonaKey(persona.persona_key);
            const seed = extractPersonaSeed(oldKey) || persona.id || Date.now().toString(36);
            let nextKey = createPersonaKeyFromSeed(nextName, seed);
            if (nextKey === oldKey) {
                nextKey = createPersonaKeyFromSeed(nextName, Date.now().toString(36));
            }

            const nextState = {
                ...(persona.state && typeof persona.state === 'object' ? persona.state : {}),
                personaName: nextName,
                savedAt: new Date().toISOString()
            };
            const nextProfile = {
                ...(persona.profile && typeof persona.profile === 'object' ? persona.profile : {}),
                persona_key: nextKey,
                persona_name: nextName,
                generated_at: new Date().toISOString()
            };
            let updated = false;
            let attempts = 0;
            while (!updated && attempts < 4) {
                const { error } = await supabase
                    .from(PERSONA_TABLE)
                    .update({
                        name: nextName,
                        persona_key: nextKey,
                        state: nextState,
                        profile: nextProfile
                    })
                    .eq('id', persona.id)
                    .eq('user_id', currentUser.id);

                if (!error) {
                    updated = true;
                    break;
                }
                if (isUniqueKeyError(error)) {
                    attempts += 1;
                    nextKey = createPersonaKeyFromSeed(nextName, `${seed}${Date.now().toString(36).slice(-4)}`);
                    continue;
                }
                alert(`Could not rename persona: ${error.message || error}`);
                return;
            }
            if (!updated) {
                alert('Could not rename persona right now. Please try again.');
                return;
            }

            const movedPortrait = await movePortraitForPersonaKey(persona, nextKey);
            if (movedPortrait.portraitPath || movedPortrait.portraitUrl) {
                const stateWithPortrait = {
                    ...nextState,
                    personaPortraitPath: movedPortrait.portraitPath || '',
                    personaPortrait: movedPortrait.portraitUrl || nextState.personaPortrait || ''
                };
                const { error: portraitError } = await supabase
                    .from(PERSONA_TABLE)
                    .update({
                        portrait_data_url: movedPortrait.portraitUrl,
                        portrait_storage_path: movedPortrait.portraitPath,
                        state: stateWithPortrait,
                        profile: nextProfile
                    })
                    .eq('id', persona.id)
                    .eq('user_id', currentUser.id);
                if (portraitError) {
                    console.warn('Could not persist portrait path after rename:', portraitError.message || portraitError);
                }
            }

            const oldSessionKey = getSessionStorageKeyForPersona(oldKey);
            const oldSessionId = localStorage.getItem(oldSessionKey) || '';
            if (oldSessionId) {
                setStoredActiveSessionId(nextKey, oldSessionId);
            }
            localStorage.removeItem(oldSessionKey);

            if (activePersona?.id === persona.id) {
                localStorage.setItem('persona-name', nextName);
                localStorage.setItem(ACTIVE_PERSONA_KEY_STORAGE, nextKey);
                if (movedPortrait.portraitPath) {
                    localStorage.setItem('persona-portrait-storage-path', movedPortrait.portraitPath);
                }
                if (movedPortrait.portraitUrl) {
                    localStorage.setItem('persona-portrait', movedPortrait.portraitUrl);
                }
                updateChatUrl(nextKey, activeSession?.id || oldSessionId || '');
            }

            await loadPersonasForUser(currentUser.id);
        }

        async function deletePersona(persona) {
            if (!persona || !currentUser?.id) return;
            const personaName = persona.name || 'this persona';
            const confirmed = window.confirm(`Delete "${personaName}" and all of its chat windows/messages? This cannot be undone.`);
            if (!confirmed) return;

            const portraitPath = String(
                persona.portrait_storage_path
                || (persona.state && persona.state.personaPortraitPath)
                || ''
            ).trim();

            if (portraitPath) {
                await supabase.storage.from(PERSONA_PORTRAITS_BUCKET).remove([portraitPath]);
            }

            const deletedActive = activePersona?.id === persona.id;
            const { error } = await supabase
                .from(PERSONA_TABLE)
                .delete()
                .eq('id', persona.id)
                .eq('user_id', currentUser.id);

            if (error) {
                alert(`Could not delete persona: ${error.message || error}`);
                return;
            }

            localStorage.removeItem(getSessionStorageKeyForPersona(persona.persona_key));
            if (deletedActive) {
                clearPersonaLocalState();
                localStorage.removeItem(ACTIVE_PERSONA_KEY_STORAGE);
            }

            await loadPersonasForUser(currentUser.id);
            if (!personas.length) {
                updateChatUrl('', '');
            }
        }

        async function renameChatSession(session) {
            if (!session || !currentUser?.id) return;
            const currentTitle = String(session.title || 'New chat').trim() || 'New chat';
            const input = window.prompt('Rename chat window:', currentTitle);
            if (input === null) return;
            const nextTitle = input.trim().slice(0, 80);
            if (!nextTitle || nextTitle === currentTitle) return;

            const { error } = await supabase
                .from(CHAT_SESSION_TABLE)
                .update({ title: nextTitle })
                .eq('id', session.id)
                .eq('user_id', currentUser.id);

            if (error) {
                alert(`Could not rename chat window: ${error.message || error}`);
                return;
            }

            chatSessions = chatSessions.map((row) => row.id === session.id ? { ...row, title: nextTitle } : row);
            if (activeSession?.id === session.id) {
                activeSession = { ...activeSession, title: nextTitle };
            }
            renderChatSessionList();
        }

        async function deleteChatSession(session) {
            if (!session || !currentUser?.id || !activePersona) return;
            const title = session.title || 'this chat window';
            const confirmed = window.confirm(`Delete "${title}"? This cannot be undone.`);
            if (!confirmed) return;

            const wasActive = activeSession?.id === session.id;
            const { error } = await supabase
                .from(CHAT_SESSION_TABLE)
                .delete()
                .eq('id', session.id)
                .eq('user_id', currentUser.id);

            if (error) {
                alert(`Could not delete chat window: ${error.message || error}`);
                return;
            }

            chatSessions = chatSessions.filter((row) => row.id !== session.id);
            if (!chatSessions.length) {
                activeSession = null;
                activeMessages = [];
                setStoredActiveSessionId(activePersona.persona_key, '');
                updateChatUrl(activePersona.persona_key, '');
                renderChatSessionList();
                renderMessages();
                return;
            }

            if (wasActive) {
                await openChatSession(chatSessions[0].id);
                return;
            }

            renderChatSessionList();
        }

        function formatProbability(probability) {
            const value = Number(probability || 0);
            if (!Number.isFinite(value)) return '0%';
            const percent = value <= 1 ? value * 100 : value;
            return `${Math.round(percent)}%`;
        }

        function probabilityFillWidth(probability) {
            const value = Number(probability || 0);
            if (!Number.isFinite(value)) return 0;
            return Math.max(0, Math.min(100, value <= 1 ? value * 100 : value));
        }

        function buildOutcomeItems(items, branchIndex) {
            return items.map((item, itemIndex) => {
                const probability = Number(item.probability || 0);
                const fillWidth = probabilityFillWidth(probability);
                return `
                <li>

                    accountIndicator.dataset.state = 'signed-out';
                    window.location.href = 'sign-in.html?auth=required';
                    return;
                }
                currentUser = data.session.user;
                await migrateLegacyDefaultPersonaKeys(currentUser.id);
                const meta = currentUser.user_metadata || {};

                const first = meta.first_name || '';
                const last = meta.last_name || '';
                const displayName = (first || last) ? `Welcome ${first} ${last}`.trim() : currentUser.email || 'Welcome';
                accountIndicator.textContent = displayName;
                accountIndicator.dataset.state = 'signed-in';

                if (!meta.profile_completed) {
                    window.location.href = 'profile.html';
                    return;
                }

                await loadPersonasForUser(currentUser.id);
            } catch (err) {
                accountIndicator.textContent = 'Session check failed';
                accountIndicator.dataset.state = 'signed-out';
                console.error(err);

                const activeKey = activePersona?.persona_key || getActivePersonaKey();

        async function sendToAssistant(messages) {
            const { data: sessionData, error } = await supabase.auth.getSession();
            if (error || !sessionData?.session?.access_token) {
                throw new Error('Auth session missing. Please sign in again.');
            }
            const accessToken = sessionData.session.access_token;
            const activePersonaKey = activePersona?.persona_key || '';
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${accessToken}`
                },
                body: JSON.stringify({
                    messages,
                    personaKey: activePersonaKey
                })
            });
            if (!res.ok) {
                const body = await res.json().catch(() => ({}));
                const msg = body?.error || (await res.text().catch(() => ''));
                throw new Error(`Assistant error (${res.status}): ${msg}`);
            }
            const payload = await res.json();
            return payload.reply || payload.choices?.[0]?.message?.content || 'No reply';
        }

        async function sendMessage() {
            if (isSending) return;
            const text = chatInput.value.trim();
            if (!text) return;
            if (!activePersona) {
                addMessage('Select a persona first.', 'agent');
                return;
            }
            if (!activeSession) {
                await createNewChat();
                if (!activeSession) return;
            }

            isSending = true;
            chatInput.value = '';
            sendBtn.disabled = true;

            const userTime = new Date().toISOString();
            addMessage(text, 'user', userTime);
            activeMessages.push({ role: 'user', content: text, created_at: userTime });
            await persistMessage('user', text);
            await maybeUpdateSessionTitle(text);

            const loadingWrapper = document.createElement('div');
            loadingWrapper.className = 'message agent';
            const content = document.createElement('div');
            content.className = 'loading-wrap';
            content.innerHTML = `<div class="loading-bar"></div><span class="message-time">processing...</span>`;
            loadingWrapper.appendChild(content);
            chatMessages.appendChild(loadingWrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const history = activeMessages
                    .filter((msg) => msg.role === 'user' || msg.role === 'assistant')
                    .slice(-20)
                    .map((msg) => ({ role: msg.role, content: msg.content }));

                const messages = history;

                const response = await sendToAssistant(messages);
                const assistantTime = new Date().toISOString();
                loadingWrapper.remove();
                addMessage(response, 'agent', assistantTime);
                activeMessages.push({ role: 'assistant', content: response, created_at: assistantTime });
                await persistMessage('assistant', response);
                await touchActiveSession();
            } catch (err) {
                loadingWrapper.remove();
                addMessage(`Error contacting Syntrae Guide: ${err.message}`, 'agent');
            } finally {
                isSending = false;
                sendBtn.disabled = false;
            }
        }

        if (isDecisionTreeDemo()) {
            window.location.replace(demoUrl('DashboardDemo.html', { state: getDemoState() }));
        } else {
            sendBtn.addEventListener('click', () => {
                void sendMessage();
            });
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    void sendMessage();
                }
            });
            createPersonaBtn?.addEventListener('click', () => {
                void createPersona();
            });
            newChatBtn?.addEventListener('click', () => {
                void createNewChat();
            });

            await loadSession();

            window.SyntraePageTour?.init({
                pageKey: 'chat',
                title: 'Dashboard guide',
                triggerText: 'Page guide',
                steps: [
                    {
                        selector: '.persona-column',
                        title: 'Your Persona',
                        description: 'This column stores the personas you build about other people. Select one here before starting any rehearsal or decision chat.',
                        placement: 'right'
                    },
                    {
                        selector: '.chat-column',
                        title: 'Dashboard',
                        description: 'This main column is the live Dashboard. It holds chat sessions, message history, and the input box used to work through one situation at a time.',
                        placement: 'left'
                    },
                    {
                        selector: '#moreBtn',
                        title: 'Navigation',
                        description: 'Use this menu to move to the rest of Syntrae: persona analysis, the account-level persona page, and Insight Lab.',
                        placement: 'left',
                        highlightSelector: 'header',
                        highlight: 'soft'
                    }
                ]
            });
        }
    </script>
</body>
</html>
