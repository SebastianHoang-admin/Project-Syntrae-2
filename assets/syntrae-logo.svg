<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Syntrae logo</title>
  <desc id="desc">Syntrae wordmark with two human figures forming a heart, a center star, and the tagline Less guessing. More caring.</desc>
  <defs>
    <linearGradient id="syntraeMarkGradient" x1="430" y1="210" x2="1110" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#063f3e"/>
      <stop offset="0.48" stop-color="#0d5a55"/>
      <stop offset="1" stop-color="#7c9275"/>
    </linearGradient>
    <linearGradient id="syntraeTextGradient" x1="260" y1="620" x2="1330" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#094441"/>
      <stop offset="0.52" stop-color="#0a514d"/>
      <stop offset="1" stop-color="#123f3d"/>
    </linearGradient>
    <filter id="softLogoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#123f3d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>

  <g filter="url(#softLogoShadow)">
    <circle cx="630" cy="213" r="31" fill="#074542"/>
    <circle cx="970" cy="213" r="31" fill="#7d9175"/>

    <path
      d="M777 343
         C712 252 552 244 520 365
         C493 468 596 589 704 665
         C750 697 784 716 802 716
         C787 714 763 706 734 691
         C608 625 487 508 471 406
         C458 321 509 267 579 256
         C663 243 733 286 777 343Z"
      fill="url(#syntraeMarkGradient)"/>

    <path
      d="M823 343
         C888 252 1048 244 1080 365
         C1107 468 1004 589 896 665
         C850 697 816 716 798 716
         C813 714 837 706 866 691
         C992 625 1113 508 1129 406
         C1142 321 1091 267 1021 256
         C937 243 867 286 823 343Z"
      fill="url(#syntraeMarkGradient)"/>

    <path
      d="M800 395
         L815 473
         L895 489
         L815 505
         L800 584
         L785 505
         L705 489
         L785 473Z"
      fill="none"
      stroke="#6f866a"
      stroke-width="13"
      stroke-linejoin="miter"/>

    <text
      x="800"
      y="790"
      text-anchor="middle"
      font-family="Montserrat, Avenir Next, Futura, Arial, sans-serif"
      font-size="138"
      font-weight="500"
      letter-spacing="68"
      fill="url(#syntraeTextGradient)">SYNTRAE</text>

    <line x1="725" y1="842" x2="875" y2="842" stroke="#7b9075" stroke-width="4"/>

    <text
      x="455"
      y="932"
      font-family="Montserrat, Avenir Next, Arial, sans-serif"
      font-size="54"
      font-weight="300"
      letter-spacing="18"
      fill="#a7a8ad">Less guessing.</text>
    <text
      x="860"
      y="932"
      font-family="Montserrat, Avenir Next, Arial, sans-serif"
      font-size="54"
      font-weight="700"
      letter-spacing="10"
      fill="#0a4a47">More caring.</text>
  </g>
</svg>
